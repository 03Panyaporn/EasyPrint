# กำหนด Image ที่จะใช้รัน (เลือกตามเวอร์ชัน Node ที่คุณใช้)
image: node:20

# 1. นิยาม Stages ทั้ง 4
stages:
  - build
  - test
  - staging
  - deploy

# 2. Stage: Build (ติดตั้ง Dependencies เตรียมไว้)
build_app:
  stage: build
  script:
    - cd backend && npm install
    - cd ../my-app && npm install && npm run build
  artifacts:
    paths:
      - my-app/dist/       # เก็บไฟล์ที่ build เสร็จแล้วไปใช้ต่อใน stage อื่น
      - backend/node_modules/

# 3. Stage: Test (ส่วนที่คุณเขียนมา)
test_backend:
  stage: test
  script:
    - cd backend
    - npm test

test_frontend:
  stage: test
  script:
    - cd my-app
    - npm run test:unit

# 4. Stage: Staging (Deploy ไปยังเซิร์ฟเวอร์ทดสอบ)
deploy_to_staging:
  stage: staging
  script:
    - echo "กำลัง Deploy Backend และ Frontend ไปที่ Staging..."
  environment:
    name: staging

# 5. Stage: Production (Deploy ไปที่ใช้งานจริง)
deploy_to_production:
  stage: deploy
  script:
    - echo "กำลัง Deploy ไปที่ Production..."
  environment:
    name: production
  when: manual  # ต้องกดปุ่มยืนยันเองใน GitLab ถึงจะเริ่มรัน
  only:
    - main      # รันเฉพาะกิ่งหลักเท่านั้น