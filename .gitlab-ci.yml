image: node:20

stages:
  - build
  - test
  - staging
  - deploy

build_app:
  stage: build
  script:
    - cd backend && npm install
    - cd ../my-app
    - npm install
    - export NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
    - export NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY
    - export NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
    - npx next build --no-lint
  artifacts:
    paths:
      - my-app/.next/
      - my-app/public/
      - my-app/package.json
      - backend/node_modules/
    expire_in: 1 day

test_backend:
  stage: test
  script:
    - cd backend
    - npm test || echo "Skipping tests"

test_frontend:
  stage: test
  script:
    - cd my-app
    - npm run test:unit || echo "Skipping tests"

deploy_to_staging:
  stage: staging
  script:
    - echo "Deploying to staging environment..."
  environment:
    name: staging

deploy_to_production:
  stage: deploy
  script:
    - echo "Deploying to production environment..."
  environment:
    name: production
  when: manual
  only:
    - main